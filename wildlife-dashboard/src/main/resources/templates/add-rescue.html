
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Rescue</title>
    <style>

        :root {
            --forest: #173f35;
            --forest-dark: #102f28;
            --leaf: #3f795b;
            --paper: #ffffff;
            --ink: #20342d;
            --muted: #718078;
            --line: #dce5df;
            --focus: rgba(63, 121, 91, 0.16);
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            font-family: Inter, "Segoe UI", Roboto, Arial, sans-serif;
            color: var(--ink);
            background:
                radial-gradient(ellipse at 12% 12%, rgba(173, 203, 174, 0.34), transparent 34%),
                linear-gradient(135deg, #f3f6f0 0%, #eaf1e9 55%, #f7f8f4 100%);
        }
        header {
            position: relative;
            overflow: hidden;
            padding: 28px max(24px, calc((100% - 1120px) / 2));
            color: #fff;
            background: linear-gradient(115deg, var(--forest-dark), var(--forest) 62%, #2b6049);
        }
        header::after {
            content: "";
            position: absolute;
            width: 250px;
            height: 250px;
            right: 8%;
            top: -155px;
            border: 1px solid rgba(255,255,255,.13);
            border-radius: 50%;
            box-shadow: 0 0 0 28px rgba(255,255,255,.035), 0 0 0 58px rgba(255,255,255,.025);
            pointer-events: none;
        }
        h1 {
            position: relative;
            z-index: 1;
            max-width: 1120px;
            margin: 0 auto;
            color: #fff;
            font-size: clamp(1.8rem, 4vw, 2.55rem);
            letter-spacing: -.04em;
            line-height: 1.15;
        }
        main {
            width: min(100% - 40px, 760px);
            margin: 42px auto 56px;
        }
        form {
            width: 100%;
            padding: 30px 34px 32px;
            background: var(--paper);
            border: 1px solid rgba(35, 71, 54, .09);
            border-radius: 22px;
            box-shadow: 0 20px 55px rgba(27, 58, 43, .09), 0 3px 10px rgba(27, 58, 43, .035);
        }
        label {
            display: block;
            margin: 20px 0 8px;
            color: #31483c;
            font-size: .88rem;
            font-weight: 700;
        }
        input, select, textarea {
            display: block;
            width: 100%;
            min-height: 49px;
            margin-top: 0;
            padding: 12px 14px;
            border: 1px solid var(--line);
            border-radius: 10px;
            outline: none;
            background: #fbfcfa;
            color: var(--ink);
            font: inherit;
            font-size: .94rem;
            transition: border-color .18s ease, box-shadow .18s ease, background .18s ease;
        }
        textarea { min-height: 110px; resize: vertical; }
        input::placeholder, textarea::placeholder { color: #a0aaa3; }
        input:hover, select:hover, textarea:hover { border-color: #b9cbbd; }
        input:focus, select:focus, textarea:focus {
            border-color: var(--leaf);
            background: #fff;
            box-shadow: 0 0 0 4px var(--focus);
        }
        button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            min-height: 48px;
            margin-top: 28px;
            padding: 0 22px;
            border: 0;
            border-radius: 10px;
            background: var(--forest);
            color: #fff;
            font: inherit;
            font-size: .93rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 5px 12px rgba(23, 63, 53, .16);
            transition: transform .18s ease, background .18s ease, box-shadow .18s ease;
        }
        button::after { content: "→"; font-size: 1.15rem; line-height: 1; }
        button:hover {
            background: #245d48;
            transform: translateY(-1px);
            box-shadow: 0 8px 18px rgba(23, 63, 53, .2);
        }
        button:active { transform: translateY(0); }
        a {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-top: 20px;
            color: var(--leaf);
            font-size: .9rem;
            font-weight: 700;
            text-decoration: none;
        }
        a::before { content: "←"; font-size: 1.1rem; }
        a:hover { color: var(--forest-dark); text-decoration: underline; text-underline-offset: 4px; }
        button:focus-visible, a:focus-visible {
            outline: 3px solid #9bc7a6;
            outline-offset: 3px;
        }
        p { margin-bottom: 0; }
        @media (max-width: 600px) {
            header { padding: 25px 22px 28px; }
            main { width: min(100% - 28px, 760px); margin: 24px auto 36px; }
            form { padding: 23px 22px 25px; border-radius: 17px; }
            button { width: 100%; }
        }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { transition: none !important; }
        }

    </style>
</head>
<body>
<header>
    <h1>Add Rescue</h1>
</header>
<main>
<form th:action="@{/rescues/save}" th:object="${rescue}" method="post" onsubmit="return validateRescueDate()">

    <label>Animal Name</label>
    <input type="text" th:field="*{animalName}" minlength="2" maxlength="120" required>

    <label>Rescue Date</label>
    <input type="date" th:field="*{rescueDate}" required>

    <label>Location</label>
    <input type="text" th:field="*{location}" minlength="2" maxlength="160" required>

    <label>Assigned Staff</label>
    <input type="text" th:field="*{assignedStaff}" minlength="2" maxlength="80" pattern="[A-Za-z .'-]{2,80}" title="Enter a valid staff name (letters, spaces, apostrophes, dots, or hyphens)." required>

    <label>Description</label>
    <textarea th:field="*{description}" rows="4" minlength="10" maxlength="1000" required></textarea>

    <label>Status</label>
    <select th:field="*{status}" required>
        <option value="">Select Status</option>
        <option value="Reported">Reported</option>
        <option value="In Progress">In Progress</option>
        <option value="Completed">Completed</option>
    </select>

    <button type="submit">Save Rescue</button>
    <p><a href="/rescues">Cancel and go back</a></p>

</form>
<script>
function validateRescueDate() {
  const field = document.getElementById("rescueDate");
  if (field && field.value) {
    const selected = new Date(field.value + "T00:00:00");
    const today = new Date(); today.setHours(0,0,0,0);
    if (selected > today) { field.setCustomValidity("Rescue date cannot be in the future."); field.reportValidity(); field.setCustomValidity(""); return false; }
  }
  return true;
}
</script>
</main>
</body>
</html>
