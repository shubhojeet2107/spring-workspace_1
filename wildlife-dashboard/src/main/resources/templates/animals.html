
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wildlife Records</title>

    <style>

:root{--forest:#173f35;--forest-dark:#102f28;--leaf:#3f795b;--paper:#fff;--ink:#20342d;--muted:#718078;--line:#dce5df;--focus:rgba(63,121,91,.16)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:Inter,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);background:radial-gradient(ellipse at 12% 12%,rgba(173,203,174,.28),transparent 34%),linear-gradient(135deg,#f3f6f0 0%,#eaf1e9 55%,#f7f8f4 100%)}
header{position:relative;overflow:hidden;padding:28px max(24px,calc((100% - 1120px)/2));color:#fff;background:linear-gradient(115deg,var(--forest-dark),var(--forest) 62%,#2b6049)}
header h1{position:relative;z-index:1;margin:0;font-size:clamp(1.8rem,4vw,2.55rem);letter-spacing:-.04em;line-height:1.15}
header p{position:relative;z-index:1;color:#d5e4d9;margin:10px 0 0}
main,.container{width:min(100% - 40px,1240px);margin:36px auto 52px}
h2{color:var(--forest);letter-spacing:-.025em}
.card,.stat-card,.table-container,.form-card{background:#fff;border:1px solid rgba(35,71,54,.08);border-radius:18px;box-shadow:0 12px 34px rgba(27,58,43,.07)}
button,.button,a.button{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:10px;padding:11px 16px;background:var(--forest);color:#fff;text-decoration:none;font:inherit;font-size:.9rem;font-weight:700;cursor:pointer;transition:background .18s ease,transform .18s ease}
button:hover,.button:hover,a.button:hover{background:#245d48;transform:translateY(-1px)}
a{color:var(--leaf)}
table{width:100%;border-collapse:collapse;min-width:760px;background:#fff}
th,td{padding:14px 13px;border-bottom:1px solid #e8eee9;text-align:left;font-size:.91rem;vertical-align:middle}
th{background:#edf3ed;color:#294d3a;font-weight:700;white-space:nowrap}
tbody tr:hover{background:#f8fbf8}
.table-container{padding:18px;overflow-x:auto}
@media(max-width:600px){header{padding:25px 22px 28px}main,.container{width:calc(100% - 28px);margin:24px auto 36px}.table-container{padding:10px;border-radius:14px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important}}

header p{margin:8px 0 0}
main{padding:0}
.actions{margin:22px 0}
.button{margin-right:8px}\n.dashboard-button{margin-right:0;margin-bottom:2px}\n.dashboard-button:hover{color:#fff}
.edit-button{display:inline-flex;padding:8px 12px;background:#e2edff;color:#174ea6;border-radius:8px;text-decoration:none;font-weight:700}
.edit-button:hover{background:#cfe0ff;color:#174ea6}
.delete-button{padding:8px 12px;background:#ffe8e8;color:#b42318;border-radius:8px;font-weight:700}
.delete-button:hover{background:#ffd3d3;color:#8f1d16}
.delete-form{display:inline}
.success{color:#236b43;font-weight:700;padding:12px 14px;background:#e8f4eb;border-radius:10px}
.error{color:#a12626;font-weight:700;padding:12px 14px;background:#fff0f0;border-radius:10px}

</style>
</head>

<body>

<header>
    <h1>Wildlife Management</h1>
    <p>Animal records from the Wildlife Service</p>
</header>

<main>

    <p><a class="button dashboard-button" href="/">← Back to Dashboard</a></p>

    <p class="success"
       th:if="${success}"
       th:text="${success}"></p>

    <p class="error"
       th:if="${error}"
       th:text="${error}"></p>

    <div class="actions">
        <a class="button" th:href="@{/animals/add}">
            + Add Animal
        </a>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Animal ID</th>
                    <th>Species Name</th>
                    <th>Age</th>
                    <th>Health Status</th>
                    <th>Identification Code</th>
                    <th>Location</th>
                    <th>Actions</th>
                </tr>
            </thead>

            <tbody>

                <tr th:each="animal : ${animals}">

                    <td th:text="${animal['animalId']}"></td>

                    <td th:text="${animal['speciesName']}"></td>

                    <td th:text="${animal['age']}"></td>

                    <td th:text="${animal['healthStatus']}"></td>

                    <td th:text="${animal['identificationCode']}"></td>

                    <td th:text="${animal['location']}"></td>

                    <td>
                        <a class="edit-button"
                           th:href="@{/animals/edit/{id}(id=${animal['animalId']})}">
                            Edit
                        </a>

                        <form class="delete-form"
                              th:action="@{/animals/delete/{id}(id=${animal['animalId']})}"
                              method="post"
                              onsubmit="return confirm('Are you sure you want to delete this animal?');">

                            <button class="delete-button" type="submit">
                                Delete
                            </button>
                        </form>
                    </td>

                </tr>

                <tr th:if="${#lists.isEmpty(animals)}">
                    <td colspan="7">No animal records found.</td>
                </tr>

            </tbody>
        </table>
    </div>

</main>

</body>
</html>
