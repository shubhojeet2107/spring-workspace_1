<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Rescue Management</title>
    <style>
:root{--forest:#173f35;--forest-dark:#102f28;--leaf:#3f795b;--ink:#20342d;--muted:#718078;--line:#dce5df;--focus:rgba(63,121,91,.16)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:Inter,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);background:radial-gradient(ellipse at 12% 12%,rgba(173,203,174,.28),transparent 34%),linear-gradient(135deg,#f3f6f0 0%,#eaf1e9 55%,#f7f8f4 100%)}
header{padding:28px max(24px,calc((100% - 1120px)/2));color:#fff;background:linear-gradient(115deg,var(--forest-dark),var(--forest) 62%,#2b6049)}
header h1,h1{margin:0;color:inherit;font-size:clamp(1.8rem,4vw,2.55rem);letter-spacing:-.04em;line-height:1.15}
header p{margin:10px 0 0;color:#d5e4d9}
main,.page-container{width:min(100% - 40px,1240px);margin:34px auto 52px}
h2{color:var(--forest);letter-spacing:-.025em}
.actions{display:flex;flex-wrap:wrap;gap:12px;margin:22px 0}
.button,button{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:10px;padding:11px 16px;background:linear-gradient(135deg,var(--forest-dark),var(--forest));color:#fff;text-decoration:none;font:inherit;font-size:.92rem;font-weight:700;cursor:pointer;transition:transform .18s ease,box-shadow .18s ease,background .18s ease}
.button:hover,button:hover{background:linear-gradient(135deg,#245d48,#347452);transform:translateY(-1px);box-shadow:0 7px 16px rgba(16,47,40,.15)}
.back-button{background:#e5eee6;color:var(--forest);border:1px solid #d4e2d6}.back-button:hover{background:#d6e6d8;color:var(--forest)}
.table-container{overflow-x:auto;background:#fff;border:1px solid rgba(35,71,54,.08);border-radius:18px;padding:18px;box-shadow:0 12px 34px rgba(27,58,43,.07)}
table{width:100%;min-width:760px;border-collapse:collapse;background:#fff}
th,td{padding:14px 13px;border-bottom:1px solid #e8eee9;text-align:left;font-size:.91rem;vertical-align:middle}
th{background:#edf3ed;color:#294d3a;font-weight:700;white-space:nowrap}
tbody tr:hover{background:#f8fbf8}tbody tr:last-child td{border-bottom:0}
.edit{display:inline-flex;padding:8px 12px;border-radius:8px;background:#e2edff;color:#174ea6;text-decoration:none;font-weight:700}.edit:hover{background:#cfe0ff}
.delete{display:inline-flex;padding:8px 12px;border-radius:8px;background:#ffe8e8;color:#b42318;text-decoration:none;font-weight:700;border:0}.delete:hover{background:#ffd3d3;color:#8f1d16}
.success{color:#236b43;font-weight:700;padding:12px 14px;background:#e8f4eb;border-radius:10px}.error{color:#a12626;font-weight:700;padding:12px 14px;background:#fff0f0;border-radius:10px}
@media(max-width:600px){header{padding:25px 22px 28px}main,.page-container{width:calc(100% - 28px);margin:24px auto 36px}.table-container{padding:10px;border-radius:14px}.actions{gap:9px}.button{padding:10px 13px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important}}
</style>
</head>
<body>
<header><h1>Rescue Management</h1></header>
<main>
<div class="actions">
    <a href="/rescues/add" class="button">+ Add Rescue</a>
    <a href="/" class="button back-button">Back to Dashboard</a>
</div>
<div class="table-container">
<table>
    <thead>
        <tr>
            <th>ID</th>
            <th>Animal Name</th>
            <th>Rescue Date</th>
            <th>Location</th>
            <th>Assigned Staff</th>
            <th>Description</th>
            <th>Status</th>
            <th>Actions</th>
        </tr>
    </thead>
    <tbody>
        <tr th:each="rescue : ${rescues}">
            <td th:text="${rescue.rescueId}"></td>
            <td th:text="${rescue.animalName}"></td>
            <td th:text="${rescue.rescueDate}"></td>
            <td th:text="${rescue.location}"></td>
            <td th:text="${rescue.assignedStaff}"></td>
            <td th:text="${rescue.description}"></td>
            <td th:text="${rescue.status}"></td>
            <td>
                <a class="edit" th:href="@{/rescues/edit/{id}(id=${rescue.rescueId})}">
                    Edit
                </a>
                <a class="delete"
                   th:href="@{/rescues/delete/{id}(id=${rescue.rescueId})}"
                   onclick="return confirm('Delete this rescue record?')">
                    Delete
                </a>
            </td>
        </tr>

        <tr th:if="${#lists.isEmpty(rescues)}">
            <td colspan="8">No rescue records found.</td>
        </tr>
    </tbody>
</table>
</div>
</main>
</body>
</html>
