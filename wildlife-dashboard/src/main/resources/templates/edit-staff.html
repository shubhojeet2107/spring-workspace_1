
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit Staff</title>
    <style>

:root{--forest:#173f35;--forest-dark:#102f28;--leaf:#3f795b;--ink:#20342d;--line:#dce5df;--focus:rgba(63,121,91,.16)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:Inter,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);background:radial-gradient(ellipse at 12% 12%,rgba(173,203,174,.28),transparent 34%),linear-gradient(135deg,#f3f6f0 0%,#eaf1e9 55%,#f7f8f4 100%)}
header{padding:28px max(24px,calc((100% - 1120px)/2));color:#fff;background:linear-gradient(115deg,var(--forest-dark),var(--forest) 62%,#2b6049)}
header h1{margin:0;font-size:clamp(1.8rem,4vw,2.55rem);letter-spacing:-.04em;line-height:1.15}
main{width:min(100% - 40px,1240px);margin:36px auto 52px}
form{width:min(100%,620px);margin:0 auto;padding:30px 34px 32px;background:#fff;border:1px solid rgba(35,71,54,.09);border-radius:22px;box-shadow:0 20px 55px rgba(27,58,43,.09)}
label{display:block;margin:20px 0 8px;color:#31483c;font-size:.9rem;font-weight:700}
input,select{display:block;width:100%;min-height:49px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;outline:none;background:#fbfcfa;color:var(--ink);font:inherit;font-size:.94rem;transition:border-color .18s,box-shadow .18s}
input:focus,select:focus{border-color:var(--leaf);background:#fff;box-shadow:0 0 0 4px var(--focus)}
button,.button,a.button{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:10px;padding:12px 17px;background:linear-gradient(120deg,var(--forest-dark),var(--forest) 65%,#2b6049);color:#fff;text-decoration:none;font:inherit;font-size:.92rem;font-weight:700;cursor:pointer;transition:filter .18s,transform .18s}
button:hover,.button:hover,a.button:hover{filter:brightness(1.12);transform:translateY(-1px)}
.secondary{background:#e7efe8!important;color:var(--forest)!important}
.secondary:hover{background:#dbe8dd!important;filter:none!important}
form button{margin-top:26px}
form p{margin-top:20px}
.was-validated input:invalid,.was-validated select:invalid{border-color:#c74646;background:#fffafa}
@media(max-width:600px){header{padding:25px 22px 28px}main{width:calc(100% - 28px);margin:24px auto 36px}form{padding:23px 22px 25px;border-radius:17px}form button{width:100%}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important}}

</style>
</head>
<body>
<header><h1>Edit Staff</h1></header>
<main>

<form th:action="@{/staff/update/{id}(id=${id})}"
      th:object="${staff}" method="post">

    <label>Staff Name</label>
    <input type="text" th:field="*{staffName}" required>

    <label>Role</label>
    <input type="text" th:field="*{role}" required>

    <label>Phone</label>
    <input type="text" th:field="*{phone}" required>

    <label>Email</label>
    <input type="email" th:field="*{email}" required>

    <label>Assigned Area</label>
    <input type="text" th:field="*{assignedArea}" required>

    <button type="submit">Update Staff</button>
    <p><a class="button secondary" href="/staff">Cancel and go back</a></p>

</form>
</main>
<script>
(() => {
  const form = document.querySelector("form");
  const textFields = form.querySelectorAll('input[type="text"]');
  const phone = textFields[2];
  const email = form.querySelector('input[type="email"]');

  textFields.forEach(field => {
    field.maxLength = 100;
    field.addEventListener("input", () => field.setCustomValidity(""));
  });
  if (phone) {
    phone.inputMode = "tel";
    phone.maxLength = 16;
    phone.pattern = "[+0-9()\\s-]{7,16}";
    phone.title = "Enter a valid phone number using 7–16 digits or common phone symbols.";
    phone.addEventListener("input", () => phone.setCustomValidity(""));
  }
  if (email) {
    email.maxLength = 254;
    email.addEventListener("input", () => email.setCustomValidity(""));
  }

  form.addEventListener("submit", event => {
    form.classList.add("was-validated");
    textFields.forEach(field => {
      field.setCustomValidity(field.value.trim() === "" ? "Please enter a value that is not only spaces." : "");
    });
    if (!form.checkValidity()) {
      event.preventDefault();
      form.reportValidity();
    }
  });
})();
</script>
</body>
</html>
