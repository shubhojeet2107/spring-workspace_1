
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Protected Area</title>
    <style>
:root{--forest:#173f35;--forest-dark:#102f28;--leaf:#3f795b;--ink:#20342d;--muted:#718078;--line:#dce5df;--focus:rgba(63,121,91,.16)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:Inter,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);background:radial-gradient(ellipse at 12% 12%,rgba(173,203,174,.28),transparent 34%),linear-gradient(135deg,#f3f6f0 0%,#eaf1e9 55%,#f7f8f4 100%)}
header{padding:28px max(24px,calc((100% - 1120px)/2));color:#fff;background:linear-gradient(115deg,var(--forest-dark),var(--forest) 62%,#2b6049)}
header h1{margin:0;font-size:clamp(1.8rem,4vw,2.55rem);letter-spacing:-.04em;line-height:1.15}
main{width:min(100% - 40px,760px);margin:38px auto 52px;padding:30px 34px 32px;background:#fff;border:1px solid rgba(35,71,54,.09);border-radius:22px;box-shadow:0 20px 55px rgba(27,58,43,.09)}
label{display:block;margin:19px 0 8px;color:#31483c;font-size:.9rem;font-weight:700}
input{display:block;width:100%;min-height:48px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;outline:none;background:#fbfcfa;color:var(--ink);font:inherit;font-size:.95rem;transition:border-color .18s,box-shadow .18s}
input:focus{border-color:var(--leaf);background:#fff;box-shadow:0 0 0 4px var(--focus)}
input.touched:invalid,form.was-validated input:invalid{border-color:#d94a4a;background:#fffafa}
.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:26px}
button,.button,a.button{display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:10px;padding:12px 18px;background:linear-gradient(135deg,var(--forest),#245d48);color:#fff;text-decoration:none;font:inherit;font-size:.92rem;font-weight:700;cursor:pointer;transition:transform .18s,box-shadow .18s}
button:hover,.button:hover,a.button:hover{background:linear-gradient(135deg,#102f28,#1d4c3b);transform:translateY(-1px);box-shadow:0 7px 16px rgba(16,47,40,.16)}
a.back{display:inline-flex;align-items:center;justify-content:center;padding:12px 18px;border-radius:10px;background:#e7efe8;color:var(--forest-dark);text-decoration:none;font-weight:700}a.back:hover{background:#d8e6da}
@media(max-width:600px){header{padding:25px 22px}main{width:calc(100% - 28px);margin:24px auto 36px;padding:23px 20px 25px} .actions>*{width:100%}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important}}
</style>
</head>
<body>
<header>
    <h1>Edit Protected Area</h1>
</header>
<main>
    <form th:action="@{/protected-areas/edit/{id}(id=${area['areaId']})}" method="post">
        <label for="areaName">Area Name</label>
        <input id="areaName" name="areaName" type="text" minlength="2" maxlength="120" th:value="${area['areaName']}" required>

        <label for="areaType">Area Type</label>
        <input id="areaType" name="areaType" type="text" minlength="2" maxlength="80" th:value="${area['areaType']}" required>

        <label for="location">Location</label>
        <input id="location" name="location" type="text" minlength="2" maxlength="160" th:value="${area['location']}" required>

        <label for="totalArea">Total Area</label>
        <input id="totalArea" name="totalArea" type="number" min="0.01" step="any"
               th:value="${area['totalArea']}" required>

        <label for="status">Status</label>
        <input id="status" name="status" type="text" minlength="2" maxlength="50" th:value="${area['status']}" required>

        <div class="actions"><button type="submit">Update Protected Area</button>
        <a class="back" th:href="@{/protected-areas}">Cancel and go back</a></div>
    </form>
</main>
</body>
</html>
